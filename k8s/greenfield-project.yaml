apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenfield-project
  namespace: default
  labels:
    app: greenfield-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greenfield-project
  template:
    metadata:
      labels:
        app: greenfield-project
    spec:
      containers:
        - name: greenfield-project
          image: 654654510727.dkr.ecr.eu-west-1.amazonaws.com/greenfield-dev-app:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: greenfield-project
  namespace: default
spec:
  type: NodePort
  selector:
    app: greenfield-project
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP